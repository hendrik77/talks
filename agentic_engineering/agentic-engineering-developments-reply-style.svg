<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <rect width="1600" height="6" fill="#e4002b"/>
  <text x="100" y="110" fill="#e4002b" font-size="20" font-weight="700" letter-spacing="6">AGENTIC ENGINEERING</text>
  <text x="100" y="196" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-1">Four shifts to loops.</text>
  <text x="100" y="244" fill="#8a8a8a" font-size="24">What changed since the five-level model: from a bash loop to a built-in finish line.</text>

  <!-- Timeline -->
  <line x1="100" y1="330" x2="1500" y2="330" stroke="#2c2c2c" stroke-width="2"/>
  <g fill="#e4002b">
    <circle cx="100" cy="330" r="9"/><circle cx="450" cy="330" r="9"/><circle cx="800" cy="330" r="9"/><circle cx="1150" cy="330" r="9"/>
  </g>

  <!-- Card 1 -->
  <rect x="100" y="370" width="320" height="400" fill="#151515" stroke="#2c2c2c"/>
  <text x="124" y="412" fill="#e4002b" font-size="16" font-weight="700" letter-spacing="3">MID 2025</text>
  <text x="124" y="470" fill="#ffffff" font-size="48" font-weight="800">01</text>
  <text x="124" y="508" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="3">RALPH LOOP</text>
  <text x="124" y="548" fill="#8a8a8a" font-size="17">Agent in a bash loop.</text>
  <text x="124" y="574" fill="#8a8a8a" font-size="17">Same goal file each run,</text>
  <text x="124" y="600" fill="#8a8a8a" font-size="17">one task per iteration.</text>
  <text x="124" y="640" fill="#8a8a8a" font-size="17">Memory lives in files</text>
  <text x="124" y="666" fill="#8a8a8a" font-size="17">and git, not in context.</text>
  <text x="124" y="730" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="2">G. HUNTLEY</text>

  <!-- Card 2 -->
  <rect x="450" y="370" width="320" height="400" fill="#151515" stroke="#2c2c2c"/>
  <text x="474" y="412" fill="#e4002b" font-size="16" font-weight="700" letter-spacing="3">FEB 2026</text>
  <text x="474" y="470" fill="#ffffff" font-size="48" font-weight="800">02</text>
  <text x="474" y="508" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="3">AGENTIC ENG.</text>
  <text x="474" y="548" fill="#8a8a8a" font-size="17">Successor to vibe coding.</text>
  <text x="474" y="574" fill="#8a8a8a" font-size="17">You orchestrate agents</text>
  <text x="474" y="600" fill="#8a8a8a" font-size="17">and keep oversight.</text>
  <text x="474" y="640" fill="#8a8a8a" font-size="17">Engineering is a skill</text>
  <text x="474" y="666" fill="#8a8a8a" font-size="17">you can learn.</text>
  <text x="474" y="730" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="2">A. KARPATHY</text>

  <!-- Card 3 -->
  <rect x="800" y="370" width="320" height="400" fill="#151515" stroke="#2c2c2c"/>
  <text x="824" y="412" fill="#e4002b" font-size="16" font-weight="700" letter-spacing="3">MAR 2026</text>
  <text x="824" y="470" fill="#ffffff" font-size="48" font-weight="800">03</text>
  <text x="824" y="508" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="3">HARNESS</text>
  <text x="824" y="548" fill="#8a8a8a" font-size="17">Planner, generator,</text>
  <text x="824" y="574" fill="#8a8a8a" font-size="17">evaluator. A sprint</text>
  <text x="824" y="600" fill="#8a8a8a" font-size="17">contract defines "done"</text>
  <text x="824" y="626" fill="#8a8a8a" font-size="17">before any code exists.</text>
  <text x="824" y="666" fill="#8a8a8a" font-size="17">Agents grade their own</text>
  <text x="824" y="692" fill="#8a8a8a" font-size="17">work too kindly.</text>
  <text x="824" y="730" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="2">ANTHROPIC</text>

  <!-- Card 4 highlight -->
  <rect x="1150" y="370" width="350" height="400" fill="#e4002b"/>
  <text x="1174" y="412" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="3" opacity="0.9">2026</text>
  <text x="1174" y="470" fill="#ffffff" font-size="48" font-weight="800">04</text>
  <text x="1174" y="508" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="3">/GOAL</text>
  <text x="1174" y="548" fill="#ffffff" font-size="17" opacity="0.9">Set a completion condition.</text>
  <text x="1174" y="574" fill="#ffffff" font-size="17" opacity="0.9">After every turn a separate</text>
  <text x="1174" y="600" fill="#ffffff" font-size="17" opacity="0.9">model checks it. Built on</text>
  <text x="1174" y="626" fill="#ffffff" font-size="17" opacity="0.9">a Stop hook, built into</text>
  <text x="1174" y="652" fill="#ffffff" font-size="17" opacity="0.9">Claude Code.</text>
  <text x="1174" y="730" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="2">CLAUDE CODE</text>

  <!-- Fuß: Bedingung -->
  <line x1="100" y1="815" x2="1500" y2="815" stroke="#2c2c2c"/>
  <text x="100" y="855" fill="#e4002b" font-size="16" font-weight="700" letter-spacing="3">GOOD CONDITION</text>
  <text x="330" y="855" fill="#ffffff" font-size="19">"All tests in test/auth pass, lint is clean"</text>
  <text x="900" y="855" fill="#e4002b" font-size="16" font-weight="700" letter-spacing="3">NOT CHECKABLE</text>
  <text x="1115" y="855" fill="#8a8a8a" font-size="19">"The app is production-ready"</text>
</svg>
