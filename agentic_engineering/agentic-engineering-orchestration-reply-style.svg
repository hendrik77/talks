<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e4002b"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a8a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <rect width="1600" height="6" fill="#e4002b"/>
  <text x="100" y="110" fill="#e4002b" font-size="20" font-weight="700" letter-spacing="6">LEVEL 05 · ORCHESTRATION</text>
  <text x="100" y="196" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-1">One agent builds. Another judges.</text>
  <text x="100" y="244" fill="#8a8a8a" font-size="24">Separate roles, agreed criteria, state in files and git.</text>

  <!-- Planner -->
  <rect x="100" y="400" width="300" height="220" fill="#151515" stroke="#2c2c2c"/>
  <text x="124" y="448" fill="#e4002b" font-size="16" font-weight="700" letter-spacing="3">AGENT 1</text>
  <text x="124" y="492" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="2">PLANNER</text>
  <text x="124" y="534" fill="#8a8a8a" font-size="17">Expands a short prompt</text>
  <text x="124" y="560" fill="#8a8a8a" font-size="17">into a full product spec.</text>

  <!-- Generator -->
  <rect x="560" y="330" width="300" height="220" fill="#e4002b"/>
  <text x="584" y="378" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="3" opacity="0.9">AGENT 2</text>
  <text x="584" y="422" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="2">GENERATOR</text>
  <text x="584" y="464" fill="#ffffff" font-size="17" opacity="0.9">Builds feature by feature</text>
  <text x="584" y="490" fill="#ffffff" font-size="17" opacity="0.9">in sprints, commits to git.</text>

  <!-- Evaluator -->
  <rect x="560" y="630" width="300" height="190" fill="#151515" stroke="#2c2c2c"/>
  <text x="584" y="678" fill="#e4002b" font-size="16" font-weight="700" letter-spacing="3">AGENT 3</text>
  <text x="584" y="722" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="2">EVALUATOR</text>
  <text x="584" y="764" fill="#8a8a8a" font-size="17">Tests the running app</text>
  <text x="584" y="790" fill="#8a8a8a" font-size="17">like a user (Playwright).</text>

  <!-- Contract -->
  <rect x="1020" y="470" width="300" height="220" fill="#151515" stroke="#e4002b" stroke-width="2"/>
  <text x="1044" y="518" fill="#e4002b" font-size="16" font-weight="700" letter-spacing="3">BEFORE CODE</text>
  <text x="1044" y="562" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="1">SPRINT CONTRACT</text>
  <text x="1044" y="604" fill="#8a8a8a" font-size="17">Testable criteria for "done".</text>
  <text x="1044" y="630" fill="#8a8a8a" font-size="17">One failed criterion fails</text>
  <text x="1044" y="656" fill="#8a8a8a" font-size="17">the sprint.</text>

  <!-- Arrows -->
  <line x1="400" y1="470" x2="552" y2="450" stroke="#8a8a8a" stroke-width="3" marker-end="url(#aw)"/>
  <text x="440" y="436" fill="#8a8a8a" font-size="14" letter-spacing="2">SPEC</text>
  <line x1="640" y1="552" x2="640" y2="622" stroke="#e4002b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="624" y="594" fill="#ffffff" font-size="14" letter-spacing="2" text-anchor="end">RUNNING APP</text>
  <line x1="780" y1="630" x2="780" y2="558" stroke="#e4002b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="796" y="594" fill="#ffffff" font-size="14" letter-spacing="2">FEEDBACK</text>
  <line x1="1020" y1="560" x2="868" y2="470" stroke="#8a8a8a" stroke-width="3" marker-end="url(#aw)" stroke-dasharray="6 6"/>
  <line x1="1020" y1="620" x2="868" y2="710" stroke="#8a8a8a" stroke-width="3" marker-end="url(#aw)" stroke-dasharray="6 6"/>

  <!-- Files and git -->
  <rect x="1380" y="330" width="120" height="490" fill="#151515" stroke="#2c2c2c"/>
  <text x="1440" y="400" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="3" text-anchor="middle">FILES</text>
  <text x="1440" y="428" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="3" text-anchor="middle">+ GIT</text>
  <text x="1440" y="480" fill="#8a8a8a" font-size="14" text-anchor="middle">Handoff</text>
  <text x="1440" y="502" fill="#8a8a8a" font-size="14" text-anchor="middle">between</text>
  <text x="1440" y="524" fill="#8a8a8a" font-size="14" text-anchor="middle">agents</text>
</svg>
