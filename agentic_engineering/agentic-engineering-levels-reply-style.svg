<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e4002b"/>
    </marker>
  </defs>

  <!-- Hintergrund -->
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <rect x="0" y="0" width="1600" height="6" fill="#e4002b"/>

  <!-- Kopf -->
  <text x="100" y="110" fill="#e4002b" font-size="20" font-weight="700" letter-spacing="6">AGENTIC ENGINEERING</text>
  <text x="100" y="196" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-1">From prompt to loop.</text>
  <text x="100" y="244" fill="#8a8a8a" font-size="24">Five levels. Each exists because the one below it hit a ceiling.</text>

  <!-- Stufen -->
  <g>
    <!-- 1 -->
    <rect x="100" y="670" width="270" height="150" fill="#151515" stroke="#2c2c2c"/>
    <text x="124" y="728" fill="#ffffff" font-size="48" font-weight="800">01</text>
    <text x="124" y="764" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="3">PROMPTING</text>
    <text x="124" y="794" fill="#8a8a8a" font-size="16">Describe it, agent builds</text>

    <!-- 2 -->
    <rect x="370" y="595" width="270" height="225" fill="#151515" stroke="#2c2c2c"/>
    <text x="394" y="653" fill="#ffffff" font-size="48" font-weight="800">02</text>
    <text x="394" y="689" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="3">CONTEXT</text>
    <text x="394" y="719" fill="#8a8a8a" font-size="16">CLAUDE.md + Skills</text>
    <text x="394" y="743" fill="#8a8a8a" font-size="16">Knowledge on tap</text>

    <!-- 3 -->
    <rect x="640" y="520" width="270" height="300" fill="#151515" stroke="#2c2c2c"/>
    <text x="664" y="578" fill="#ffffff" font-size="48" font-weight="800">03</text>
    <text x="664" y="614" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="3">HOOKS</text>
    <text x="664" y="644" fill="#8a8a8a" font-size="16">Automatic checks</text>
    <text x="664" y="668" fill="#8a8a8a" font-size="16">Quality gates in-session</text>

    <!-- 4 (Highlight) -->
    <rect x="910" y="445" width="270" height="375" fill="#e4002b"/>
    <text x="934" y="503" fill="#ffffff" font-size="48" font-weight="800">04</text>
    <text x="934" y="539" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="3">LOOPS</text>
    <text x="934" y="569" fill="#ffffff" font-size="16" opacity="0.9">Define the outcome,</text>
    <text x="934" y="593" fill="#ffffff" font-size="16" opacity="0.9">agent iterates until done</text>
    <text x="934" y="640" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="2">/GOAL · RALPH</text>

    <!-- 5 -->
    <rect x="1180" y="370" width="270" height="450" fill="#151515" stroke="#2c2c2c"/>
    <text x="1204" y="428" fill="#ffffff" font-size="48" font-weight="800">05</text>
    <text x="1204" y="464" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="3">ORCHESTRATION</text>
    <text x="1204" y="494" fill="#8a8a8a" font-size="16">Parallel agents,</text>
    <text x="1204" y="518" fill="#8a8a8a" font-size="16">Planner, generator,</text>
    <text x="1204" y="542" fill="#8a8a8a" font-size="16">evaluator</text>
  </g>

  <!-- Loop-Symbol über Stufe 4 -->
  <g fill="none" stroke="#e4002b" stroke-width="5" stroke-linecap="round">
    <path d="M1010 372 A42 42 0 1 1 1052 414" marker-end="url(#ah)"/>
  </g>
  <text x="1045" y="330" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="3" text-anchor="middle">UNTIL DONE</text>

  <!-- Fuß -->
  <line x1="100" y1="850" x2="1450" y2="850" stroke="#2c2c2c"/>
</svg>
